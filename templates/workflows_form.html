{{define "workflows_form.html"}}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>{{template "head" .}}</head>
{{template "page_shell_start" .}}
<div class="app-page">
<header class="app-page-header">
    <div class="app-page-header-text">
        <h2 class="app-page-title">New Workflow</h2>
    </div>
</header>
<div class="app-page-body app-page-body--narrow">
<div class="card max-w-2xl">
    <form method="POST" action="/workflows" class="space-y-5">
        <div>
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-input" required placeholder="Cold outreach sequence">
        </div>
        <div>
            <label class="form-label">Description</label>
            <textarea name="description" class="form-input" rows="3" placeholder="Optional description"></textarea>
        </div>
        <button type="submit" class="btn-primary">Create &amp; open builder</button>
    </form>
</div>
</div>
</div>
{{template "page_shell_end" .}}
</body>
</html>
{{end}}
