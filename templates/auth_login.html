{{define "auth_login.html"}}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>{{template "head" .}}</head>
<body class="h-full bg-ivory text-charcoal">
<div class="min-h-full flex items-center justify-center p-6">
<div class="card w-full max-w-md">
    <div class="flex items-center gap-3 mb-6">
        <img src="/static/img/logo.png" alt="jupsend" class="auth-logo">
        <div>
            <h1 class="text-xl font-bold text-charcoal">jupsend</h1>
            <p class="text-gray-500 text-xs">Email outreach</p>
        </div>
    </div>
    <h2 class="text-lg font-semibold text-charcoal mb-1">Sign in</h2>
    <p class="text-gray-500 text-sm mb-6">Continue with the Google account you used to sign up.</p>
    {{if .error}}<div class="alert-error mb-4">{{.error}}</div>{{end}}
    {{if .googleConfigured}}
    <form method="GET" action="/auth/google/login">
        <input type="hidden" name="next" value="{{.next}}">
        <button type="submit" class="btn-primary w-full justify-center">Continue with Google</button>
    </form>
    {{else}}
    <div class="alert-error">Google sign-in is not configured on this server.</div>
    {{end}}
    <p class="text-sm text-gray-500 mt-6 text-center">No account? <a href="/signup" class="text-brand-600 font-medium">Sign up</a></p>
</div>
</div>
</body>
</html>
{{end}}
