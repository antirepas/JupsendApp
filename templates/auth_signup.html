{{define "auth_signup.html"}}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>{{template "head" .}}</head>
<body class="h-full bg-ivory text-charcoal">
<div class="min-h-full flex items-center justify-center p-6">
<div class="card w-full max-w-md">
    <div class="flex items-center gap-3 mb-6">
        <img src="/static/img/logo.png" alt="jupsend" class="auth-logo">
        <div>
            <h1 class="text-xl font-bold text-charcoal">jupsend</h1>
            <p class="text-gray-500 text-xs">Email outreach</p>
        </div>
    </div>
    <h2 class="text-lg font-semibold text-charcoal mb-1">Create account</h2>
    <p class="text-gray-500 text-sm mb-6">Your contacts, campaigns, and Gmail connection in one place.</p>
    {{if .error}}<div class="alert-error mb-4">{{.error}}</div>{{end}}
    <form method="POST" action="/signup" class="space-y-4">
        <div>
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-input" required autofocus>
        </div>
        <div>
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-input" required minlength="8">
        </div>
        <div>
            <label class="form-label">Confirm password</label>
            <input type="password" name="confirm_password" class="form-input" required minlength="8">
        </div>
        <button type="submit" class="btn-primary w-full justify-center">Create account</button>
    </form>
    <p class="text-sm text-gray-500 mt-6 text-center">Already have an account? <a href="/login" class="text-brand-600 font-medium">Sign in</a></p>
</div>
</div>
</body>
</html>
{{end}}
