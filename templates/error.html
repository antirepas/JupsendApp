{{define "error.html"}}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>{{template "head" .}}</head>
{{template "page_shell_start" .}}
<div class="app-page">
<header class="app-page-header">
  <div class="app-page-header-text">
    <h2 class="app-page-title">Error</h2>
  </div>
</header>
<div class="app-page-body app-page-body--narrow">
<div class="card text-center py-12">
    <div class="text-red-500 mb-4">
        <svg class="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    </div>
    <h2 class="text-xl font-bold text-slate-900 mb-2">Something went wrong</h2>
    <p class="text-slate-500 mb-6">{{.error}}</p>
    <a href="/" class="btn-primary">Back to Dashboard</a>
</div>
</div>
</div>
{{template "page_shell_end" .}}
</body>
</html>
{{end}}
