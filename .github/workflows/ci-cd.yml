name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emailtracker
          POSTGRES_PASSWORD: emailtracker
          POSTGRES_DB: emailtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emailtracker -d emailtracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://emailtracker:emailtracker@localhost:5432/emailtracker_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build CSS
        run: npm ci && npm run build:css

      - name: Verify committed Tailwind CSS is current
        run: |
          if ! git diff --exit-code static/css/tailwind.css; then
            echo "::error::static/css/tailwind.css is out of date. Run: npm ci && npm run build:css"
            echo "Then commit the updated file: git add static/css/tailwind.css"
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Build binary
        run: go build -v -o emailtracker .

  docker:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercase package name must match what the droplet pulls.
          images: ghcr.io/antirepas/emailtracker
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Droplet
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            IMAGE="ghcr.io/antirepas/emailtracker:${{ github.sha }}"
            echo "Deploying $IMAGE"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker stop emailtracker || true
            docker rm emailtracker || true
            docker run -d \
              --name emailtracker \
              --restart unless-stopped \
              --env-file /opt/emailtracker/.env \
              -p 127.0.0.1:8080:8080 \
              "$IMAGE"
            sleep 2
            docker exec emailtracker grep -q "Import contacts" /app/templates/dashboard.html
            echo "Template check OK"
            wget -qO- http://127.0.0.1:8080/healthz || true
            echo
            docker image prune -f
            docker logout ghcr.io || true
